# Configuration for the machine learning model.

# REQUIRED.
# The machine learning algorithm to be used for training.
algorithm: XGBoost

# REQUIRED.
# The name of variable used to group data.
group: "Entity code"

# REQUIRED.
# The features used for training the model.
features:
  - "Entity code"
  - "Local hour of the day"
  - "Local weekend indicator"
  - "Local major holiday indicator"
  - "Local other holiday indicator"
  - "Local month of the year"
  - "Temperature - Top 1 (K)"
  - "Temperature - Top 3 (K)"
  - "Monthly average temperature - Top 1 (K)"
  - "Monthly average temperature rank - Top 1"
  - "Annual average temperature - Top 1 (K)"
  - "5 percentile temperature - Top 1 (K)"
  - "95 percentile temperature - Top 1 (K)"
  - "GDP PPP per capita (2021 international $)"
  - "Annual electricity demand per capita (kWh)"

# REQUIRED.
# The target variable for the model.
target: "Load (fraction of annual total)"

# REQUIRED.
# Variable used to split data into training, validation, and testing sets.
splitter: "Local year"

# REQUIRED.
# The time variable in the dataset.
time: "Time (UTC)"

# OPTIONAL.
# The categorical features used for training the model.
categorical_features:
  - "Entity code"
  - "Local hour of the day"
  - "Local weekend indicator"
  - "Local major holiday indicator"
  - "Local other holiday indicator"
  - "Local month of the year"
  - "Monthly average temperature rank - Top 1"

# OPTIONAL.
# The fixed categories of the text categorical features, in the order of
# their codes. Required for every non-numeric categorical feature, so
# that training and forecasting use the same codes. Entities that are
# not listed cannot be modelled.
categorical_values:
  "Entity code":
    - "PHL_LU"
    - "PHL_VI"
    - "PHL_MI"

# OPTIONAL.
# Variables to scale the predictions.
scaling_variables:
  - "Annual electricity demand per capita (kWh)"
  - "Population"
