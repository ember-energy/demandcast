# Configuration for the XGBoost model.

# REQUIRED.
# Random seed for reproducibility.
random_state: 42

# REQUIRED.
# Enable categorical feature support in XGBoost.
enable_categorical: true

# REQUIRED.
# Evaluation metric for model training and validation.
evaluation_metric: "mape"

#Structural parameters for the decision trees
max_depth: 8 
learning_rate : 0.05
n_estimators : 500 
subsample: 0.8 
colsample_bytree: 0.8 